name: Quality checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taxsolutions
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taxsolutions_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxsolutions"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025']
    env:
      DATABASE_URL: postgresql://taxsolutions:ci-only-password@localhost:5432/taxsolutions_test
      TEST_DATABASE_URL: postgresql://taxsolutions:ci-only-password@localhost:5432/taxsolutions_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: admin@example.invalid
      TEST_ADMIN_PASSWORD: ci-only-password-with-strong-length
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: 'TaxSolutions <test@example.invalid>'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: test
      ENABLE_MOCK_VIDEO: 'true'
      DATA_ENCRYPTION_KEY: KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio=
      TEST_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate && npm run db:seed
      - run: node --import tsx scripts/test-fixtures.ts
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:integration
      - run: npm run test:platform
      - run: npm run test:migrations
      - run: npm run build
      - name: Use preinstalled Chrome
        run: google-chrome --version
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
